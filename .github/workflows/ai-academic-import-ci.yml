name: AI Academic Import CI

on:
  push:
    branches:
      - feat/ai-academic-import
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend quality gate
        run: npm run check

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/academic-import
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Worker dependencies
        run: npm install
      - name: Generate Cloudflare types
        run: npm run cf-types
      - name: Typecheck Worker
        run: npm run typecheck
